services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://radius:radius@db:5432/radius
      USE_DATABASE: "true"
      OFAC_DATA_DIR: /app/data/ofac
      ENVIRONMENT: production
    volumes:
      - ofac_data:/app/data/ofac
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: radius
      POSTGRES_DB: radius
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  ofac_data:
