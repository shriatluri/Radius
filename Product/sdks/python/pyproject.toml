[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "getradius"
version = "0.1.0"
description = "Python SDK for Radius — payment attestation infrastructure for stablecoin transfers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Radius", email = "hello@getradius.com" },
]
keywords = ["radius", "stablecoin", "compliance", "payments", "attestation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://getradius.com"
Documentation = "https://docs.getradius.com"
Repository = "https://github.com/getradius/getradius-python"

[tool.setuptools.packages.find]
include = ["getradius*"]
