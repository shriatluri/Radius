name: CI

# When this runs:
# - Every push to main (triggers test + build + deploy)
# - Every pull request targeting main (triggers test only — no deploy on PRs)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Test + Lint
  # Runs on every push and PR. If this fails, nothing else runs.
  # -------------------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Product/requirements-dev.txt

      - name: Install dependencies
        working-directory: Product
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: Product
        run: ruff check backend/

      - name: Run tests
        working-directory: Product
        run: pytest --cov=backend/app --cov-report=term-missing

  # -------------------------------------------------------------------------
  # Job 2: Build & push Docker image
  # Only runs on pushes to main (not on PRs) and only if tests passed.
  # Pushes two tags: the commit SHA (immutable) and "latest" (floating pointer).
  # -------------------------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    # This job needs write access to push images to ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Product/
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # -------------------------------------------------------------------------
  # Job 3: Deploy to Railway
  # Only runs on main, only if the Docker image was successfully built.
  # POSTs to Railway's deploy webhook — Railway pulls the new image and redeploys.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Railway deployment
        run: curl -X POST "${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}"
